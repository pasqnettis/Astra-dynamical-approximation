[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdpa-heat"
version = "0.1.0"
description = "Regularized dynamical parametric approximation of the 2D heat equation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "optax==0.2.4",
  "numpy>=1.26,<3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "scipy>=1.11"]

[project.scripts]
rdpa-heat = "rdpa_heat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: numerical experiments beyond the fast unit tests"]
